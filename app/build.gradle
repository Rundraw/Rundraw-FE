import java.util.Properties

plugins {
    alias(libs.plugins.androidApplication)
}

def Properties properties = new Properties()
properties.load(project.rootProject.file("local.properties").newDataInputStream())

android {
    namespace 'com.example.rundraw_fe'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.rundraw_fe"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 변수 설정
        buildConfigField "String", "OAUTH_URL", "\"${properties.getProperty("OAUTH_URL")}\""
        buildConfigField "String", "LOCAL_URL", "\"${properties.getProperty("LOCAL_URL")}\""

        // local.properties에서 MAPS_API_KEY를 읽어와 AndroidManifest에서 쓸 수 있게 manifestPlaceholders로 등록
        manifestPlaceholders = [MAPS_API_KEY: properties.getProperty('MAPS_API_KEY') ?: ""]
        // 진단용 로그 (Sync 시 Build Output 창에 출력됨)
        println "=== MAPS_API_KEY CHECK: ${properties.getProperty('MAPS_API_KEY')} ==="
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
}